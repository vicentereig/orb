name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="orb-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "dist/${binary}" ./cmd/orb
          if [ "${GOOS}-${GOARCH}" = "linux-amd64" ]; then
            "./dist/${binary}" version >/dev/null
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip "orb-${GOOS}-${GOARCH}.zip" "${binary}")
          else
            tar -C dist -czf "dist/orb-${GOOS}-${GOARCH}.tar.gz" "${binary}"
          fi
          rm "dist/${binary}"
          (cd dist && sha256sum "orb-${GOOS}-${GOARCH}.${{ matrix.archive }}" > "orb-${GOOS}-${GOARCH}.${{ matrix.archive }}.sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
      - name: Prepare release bundle
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release-files/ \;
          find release -type f -name '*.sha256' -exec cat {} \; > release-files/checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for file in release-files/*.tar.gz release-files/*.zip release-files/checksums.txt; do
            [ -f "$file" ] || continue
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            release-files/*.tar.gz
            release-files/*.zip
            release-files/checksums.txt
            release-files/*.sig
            release-files/*.pem
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --title "${GITHUB_REF_NAME}" --notes ""
          fi

  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v5
        with:
          repository: vicentereig/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base_url="https://github.com/vicentereig/orb/releases/download/${GITHUB_REF_NAME}"
          formula="homebrew-tap/Formula/orb.rb"
          checksums="$(curl -sL "${base_url}/checksums.txt")"
          darwin_amd64="$(echo "$checksums" | grep 'darwin-amd64' | awk '{print $1}')"
          darwin_arm64="$(echo "$checksums" | grep 'darwin-arm64' | awk '{print $1}')"
          linux_amd64="$(echo "$checksums" | grep 'linux-amd64' | awk '{print $1}')"
          linux_arm64="$(echo "$checksums" | grep 'linux-arm64' | awk '{print $1}')"

          mkdir -p "$(dirname "$formula")"
          cat > "$formula" <<RUBY
          class Orb < Formula
            desc "Orb billing forensics from the terminal"
            homepage "https://github.com/vicentereig/orb"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${base_url}/orb-darwin-arm64.tar.gz"
                sha256 "${darwin_arm64}"
              else
                url "${base_url}/orb-darwin-amd64.tar.gz"
                sha256 "${darwin_amd64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base_url}/orb-linux-arm64.tar.gz"
                sha256 "${linux_arm64}"
              else
                url "${base_url}/orb-linux-amd64.tar.gz"
                sha256 "${linux_amd64}"
              end
            end

            def install
              bin.install Dir["orb-*"].first => "orb"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/orb version")
            end
          end
          RUBY

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/orb.rb
          git commit -m "Update orb to ${GITHUB_REF_NAME}"
          git push
